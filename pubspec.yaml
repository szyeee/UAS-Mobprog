name: sushilolz
description: A full Flutter sushi ordering application (onboarding, login, menu, cart, checkout, review, notif)
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.3
  
  # UI libs
  carousel_slider: ^5.0.0
  google_fonts: ^6.2.1

  # State Management
  provider: ^6.1.2

  # HTTP Client
  http: ^1.2.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^17.1.0
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0

  # Utilities
  intl: ^0.19.0

  # ✅ correct placement
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
  - assets/images/sushi/
  - assets/images/drinks/
  - assets/images/side_dish/
  - assets/images/condiment/
  - assets/images/banners/
  - assets/data/products.json
